<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightbox | Scybud UI</title>

    <!-- Shell: needed by shared-layout.js, keep on every example -->
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/typography.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../components/sidebar/sidebar.css" />
    <link rel="stylesheet" href="../components/buttons/nav-buttons.css" />
    <link rel="stylesheet" href="examples.css" />

    <!-- This example -->
    <link rel="stylesheet" href="../css/animations.css" />

    <style>
      /* Gallery layout is specific to this page, the lightbox itself needs no CSS */
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: var(--space-md);
      }
      .thumbnail {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border: 1px solid var(--border-primary);
        border-radius: var(--radius-md);
        cursor: zoom-in;
        transition: transform var(--transition-normal);
      }
      .thumbnail:hover {
        transform: scale(1.02);
        border-color: var(--border-secondary);
      }
    </style>
  </head>
  <body>
    <section class="example">
      <h2>Image gallery</h2>
      <p class="example-note">
        Give each image the <code>scybud-magnify</code> class and call
        <code>magnifyImg</code> on it. Click any image below.
      </p>
      <div class="example-demo">
        <div class="gallery">
          <img class="thumbnail scybud-magnify" src="https://picsum.photos/800/600?random=1" width="800" height="600" loading="lazy" alt="Sample photo 1" />
          <img class="thumbnail scybud-magnify" src="https://picsum.photos/800/600?random=2" width="800" height="600" loading="lazy" alt="Sample photo 2" />
          <img class="thumbnail scybud-magnify" src="https://picsum.photos/800/600?random=3" width="800" height="600" loading="lazy" alt="Sample photo 3" />
          <img class="thumbnail scybud-magnify" src="https://picsum.photos/800/600?random=4" width="800" height="600" loading="lazy" alt="Sample photo 4" />
          <img class="thumbnail scybud-magnify" src="https://picsum.photos/800/600?random=5" width="800" height="600" loading="lazy" alt="Sample photo 5" />
          <img class="thumbnail scybud-magnify" src="https://picsum.photos/800/600?random=6" width="800" height="600" loading="lazy" alt="Sample photo 6" />
        </div>
      </div>
    </section>

    <script type="module">
      import { magnifyImg } from "../js/ui.js";

      document.querySelectorAll(".scybud-magnify").forEach((img) => magnifyImg(img));
    </script>
    <script type="module" src="shared-layout.js"></script>
  </body>
</html>
